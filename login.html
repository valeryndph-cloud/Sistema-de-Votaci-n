<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | VotApp</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body class="login-page">
    <main class="login-container">
      <section class="login-card">
        <div class="brand-box">
          <span class="brand">VotApp</span>
          <p>Acceso al sistema de votación</p>
        </div>

        <form id="loginForm" novalidate>
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" placeholder="Ingresa tu usuario" />

          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="Ingresa tu contraseña" />

          <button type="submit" class="btn primary full">Ingresar</button>
          <p id="message" class="message" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="login.js"></script>
  </body>
</html>
